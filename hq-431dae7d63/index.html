<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Grow Empire Stats</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f3ef; --surface: #fcfcfb; --border: #e3e1da; --grid: #ebe9e3; --axis: #b9b6ac;
  --text: #0b0b0b; --text2: #52514e; --muted: #7a7872;
  --s1: #2a78d6; --s2: #eb6834; --s1soft: rgba(42,120,214,.14);
  --good: #0ca30c; --warn: #b77f00; --crit: #d03b3b;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --border: #2d2d2a; --grid: #262624; --axis: #55544f;
  --text: #f0efec; --text2: #c3c2b7; --muted: #8e8d86;
  --s1: #3987e5; --s2: #d95926; --s1soft: rgba(57,135,229,.18);
  --good: #0ca30c; --warn: #fab219; --crit: #e66767;
} }
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --border: #2d2d2a; --grid: #262624; --axis: #55544f;
  --text: #f0efec; --text2: #c3c2b7; --muted: #8e8d86;
  --s1: #3987e5; --s2: #d95926; --s1soft: rgba(57,135,229,.18);
  --good: #0ca30c; --warn: #fab219; --crit: #e66767;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 48px; }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; justify-content: space-between; margin-bottom: 14px; }
h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
.sub { color: var(--text2); font-size: 13px; margin-top: 2px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; color: var(--text2); font: inherit; font-size: 13px; padding: 6px 11px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button.on { background: var(--s1soft); color: var(--text); font-weight: 600; }
select, .btn { font: inherit; font-size: 13px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); }
.btn { cursor: pointer; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.kpi .l { color: var(--text2); font-size: 12px; }
.kpi .v { font-size: 26px; font-weight: 650; letter-spacing: -.02em; margin-top: 2px; font-variant-numeric: tabular-nums; }
.kpi .h { color: var(--muted); font-size: 11.5px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px 12px; min-width: 0; }
.card.wide { grid-column: 1 / -1; }
.card h2 { font-size: 14px; margin: 0; }
.card .d { color: var(--text2); font-size: 12px; margin: 2px 0 8px; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--text2); margin-bottom: 4px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { fill: var(--text2); font-size: 11.5px; }
.tip { position: fixed; pointer-events: none; z-index: 9; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px; font-size: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.18); white-space: nowrap; display: none; }
.tip b { font-weight: 650; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th { color: var(--text2); font-weight: 600; font-size: 12px; }
.tscroll { overflow-x: auto; }
.note { color: var(--muted); font-size: 12px; margin-top: 14px; }
.state { padding: 40px 0; text-align: center; color: var(--text2); }
.err { color: var(--crit); }
@media (max-width: 760px) { .grid { grid-template-columns: minmax(0, 1fr); } .kpi .v { font-size: 22px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Grow Empire Stats</h1><div class="sub" id="sub">Loading players…</div></div>
    <div class="filters">
      <div class="seg" id="range"><button data-d="7">7 days</button><button data-d="30" class="on">30 days</button><button data-d="90">90 days</button></div>
      <select id="plat" aria-label="Platform"><option value="">All platforms</option><option value="pc-app">PC app (Steam)</option><option value="ios-web">iPhone / iPad</option><option value="android-web">Android</option><option value="desktop-web">Desktop browser</option></select>
      <button class="btn" id="reload">Refresh</button>
    </div>
  </header>
  <div id="main"><div class="state">Loading players…</div></div>
  <p class="note">Anonymous data from players with Analytics on (Settings in the game). Days are in UTC. Players on the claude.ai link copy of the game aren't included.</p>
</div>
<div class="tip" id="tip"></div>
<script>
(() => {
const SB_URL = 'https://zgjwrbnfgevgoatwqzhc.supabase.co/rest/v1/empire', SB_KEY = 'sb_publishable_E34vV-tnuM3o1Ken4U-YQQ_Yql9UwRN';
const MILESTONES = [['tut1', 'Started tutorial'], ['sale1', 'First sale'], ['up1', 'First upgrade'], ['tutdone', 'Finished tutorial'], ['b_prod1', 'Rolling Table'], ['b_cashier', 'Hired cashier'], ['b_prod2', 'Edibles Oven'], ['lv5', 'Level 5'], ['b_zone_lab', 'Lab Wing'], ['b_prod3', 'Oil Extractor'], ['b_prod4', 'Hoodie Printer'], ['lv10', 'Level 10'], ['b_basement', 'Basement'], ['tour', 'First tour group'], ['moved', 'Opened 2nd spot'], ['franchise', 'Franchised']];
const PLAT = { 'pc-app': 'PC app', 'ios-web': 'iPhone / iPad', 'android-web': 'Android', 'desktop-web': 'Desktop browser' };
const $ = id => document.getElementById(id), tip = $('tip');
let ALL = [], days = 30, plat = '';
try { const st = JSON.parse(localStorage.getItem('pgStatsUi') || '{}'); if (st.days) days = st.days; if (st.plat !== undefined) plat = st.plat; } catch (e) {}
const saveUi = () => { try { localStorage.setItem('pgStatsUi', JSON.stringify({ days, plat })); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const iso = t => new Date(t).toISOString().slice(0, 10);
const addD = (d, n) => iso(Date.parse(d + 'T00:00:00Z') + n * 864e5);
const diffD = (a, b) => Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 864e5);
const fmt = n => n == null || !isFinite(n) ? '–' : n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e4 ? Math.round(n / 1e3) + 'K' : Math.round(n).toLocaleString();
const pct = (a, b) => b ? Math.round(100 * a / b) + '%' : '–';
const median = a => { if (!a.length) return null; const s = a.slice().sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const mins = m => m == null ? '–' : m < 1 ? Math.round(m * 60) + 's' : m < 90 ? (Math.round(m * 10) / 10) + ' min' : (Math.round(m / 6) / 10) + ' h';

// ---------- data ----------
async function load() {
  $('sub').textContent = 'Loading players…';
  const out = []; let off = 0;
  for (let k = 0; k < 50; k++) {
    const r = await fetch(SB_URL + '?select=id,data&id=like.*_an_bk&order=id&limit=1000&offset=' + off, { headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY } });
    if (!r.ok) throw new Error('The database answered ' + r.status);
    const j = await r.json(); out.push(...j); if (j.length < 1000) break; off += 1000;
  }
  ALL = out.map(r => Object.assign({ id: r.id.replace(/_an_bk$/, '') }, r.data || {})).filter(r => Array.isArray(r.days) && r.days.length);
}

// ---------- tooltip ----------
function hoverable(root) {
  root.querySelectorAll('[data-tip]').forEach(el => {
    el.addEventListener('pointermove', e => { tip.innerHTML = el.getAttribute('data-tip'); tip.style.display = 'block'; const w = tip.offsetWidth; tip.style.left = Math.min(innerWidth - w - 8, e.clientX + 12) + 'px'; tip.style.top = (e.clientY + 14) + 'px'; });
    el.addEventListener('pointerleave', () => { tip.style.display = 'none'; });
  });
}

// ---------- charts (hand-drawn SVG) ----------
function niceMax(v) { if (v <= 4) return Math.max(1, Math.ceil(v)); const p = Math.pow(10, Math.floor(Math.log10(v))), f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }
function dailyChart(rows, dList) {
  const W = 1100, H = 250, L = 44, R = 12, T = 12, B = 30, pw = W - L - R, ph = H - T - B;
  const act = dList.map(d => rows.filter(r => r.days.includes(d)).length), nw = dList.map(d => rows.filter(r => r.days[0] === d).length);
  const mx = niceMax(Math.max(1, ...act, ...nw)), x = i => L + (dList.length === 1 ? pw / 2 : i * pw / (dList.length - 1)), y = v => T + ph - v / mx * ph, bw = Math.max(3, Math.min(18, pw / dList.length * .55));
  let g = '';
  const nt = mx < 4 ? mx : 4; for (let k = 0; k <= nt; k++) { const v = mx * k / nt, yy = y(v); g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="var(--grid)"/><text x="${L - 8}" y="${yy + 4}" text-anchor="end">${fmt(v)}</text>`; }
  const step = Math.ceil(dList.length / 8);
  dList.forEach((d, i) => { if (i % step === 0 || i === dList.length - 1) g += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${d.slice(5).replace('-', '/')}</text>`; });
  dList.forEach((d, i) => { if (nw[i]) g += `<rect x="${x(i) - bw / 2}" y="${y(nw[i])}" width="${bw}" height="${Math.max(0, T + ph - y(nw[i]))}" rx="3" fill="var(--s2)" opacity=".85"/>`; });
  g += `<polyline fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" points="${act.map((v, i) => x(i) + ',' + y(v)).join(' ')}"/>`;
  act.forEach((v, i) => { g += `<circle cx="${x(i)}" cy="${y(v)}" r="${dList.length > 40 ? 2.5 : 4}" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>`; });
  const colW = pw / dList.length;
  dList.forEach((d, i) => { g += `<rect x="${x(i) - colW / 2}" y="${T}" width="${colW}" height="${ph}" fill="transparent" data-tip="<b>${d}</b><br>Active players: ${act[i]}<br>New players: ${nw[i]}"/>`; });
  g += `<line x1="${L}" x2="${W - R}" y1="${T + ph}" y2="${T + ph}" stroke="var(--axis)"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Active and new players per day">${g}</svg>`;
}
function hbars(items, opt = {}) {
  // items: [{label, v, tip, sub}] ; one measure, one hue
  const W = 540, rowH = 26, L = opt.left || 150, R = 64, H = Math.max(rowH, items.length * rowH) + 6, pw = W - L - R, mx = opt.max || Math.max(1, ...items.map(i => i.v));
  let g = '';
  items.forEach((it, k) => { const y0 = 3 + k * rowH, w = Math.max(it.v > 0 ? 3 : 0, it.v / mx * pw);
    g += `<g data-tip="${esc(it.tip || it.label + ': ' + it.v)}"><rect x="0" y="${y0}" width="${W}" height="${rowH}" fill="transparent"/><text x="${L - 10}" y="${y0 + 17}" text-anchor="end" style="fill:var(--text)">${esc(it.label)}</text>`;
    g += `<rect x="${L}" y="${y0 + 5}" width="${pw}" height="${rowH - 10}" rx="4" fill="var(--grid)" opacity=".55"/><rect x="${L}" y="${y0 + 5}" width="${w}" height="${rowH - 10}" rx="4" fill="${opt.color || 'var(--s1)'}"/>`;
    g += `<text x="${L + w + 8}" y="${y0 + 17}" style="fill:var(--text);font-weight:600">${esc(it.sub != null ? it.sub : fmt(it.v))}</text></g>`; });
  if (opt.ref != null) { const rx = L + opt.ref / mx * pw; g += `<line x1="${rx}" x2="${rx}" y1="0" y2="${H}" stroke="var(--crit)" stroke-dasharray="4 4"/><text x="${rx + 4}" y="${H + 12}" style="fill:var(--crit)">${esc(opt.refLabel || '')}</text>`; }
  return `<svg viewBox="0 0 ${W} ${H + (opt.ref != null ? 16 : 0)}" role="img" aria-label="${esc(opt.aria || 'bar chart')}">${g}</svg>`;
}
function vbars(items, aria) {
  const W = 540, H = 200, L = 36, R = 8, T = 10, B = 28, pw = W - L - R, ph = H - T - B, mx = niceMax(Math.max(1, ...items.map(i => i.v))), bw = pw / items.length;
  let g = '';
  const nt = mx < 4 ? mx : 4; for (let k = 0; k <= nt; k++) { const v = mx * k / nt, yy = T + ph - v / mx * ph; g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="var(--grid)"/><text x="${L - 6}" y="${yy + 4}" text-anchor="end">${fmt(v)}</text>`; }
  items.forEach((it, i) => { const h = it.v / mx * ph, x0 = L + i * bw + 3, yy = T + ph - h;
    g += `<g data-tip="${esc(it.tip || it.label + ': ' + it.v)}"><rect x="${L + i * bw}" y="${T}" width="${bw}" height="${ph}" fill="transparent"/><rect x="${x0}" y="${yy}" width="${bw - 6}" height="${h}" rx="4" fill="var(--s1)"/>${it.v ? `<text x="${x0 + (bw - 6) / 2}" y="${yy - 5}" text-anchor="middle" style="fill:var(--text);font-weight:600">${fmt(it.v)}</text>` : ''}<text x="${x0 + (bw - 6) / 2}" y="${H - 9}" text-anchor="middle">${esc(it.label)}</text></g>`; });
  g += `<line x1="${L}" x2="${W - R}" y1="${T + ph}" y2="${T + ph}" stroke="var(--axis)"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}">${g}</svg>`;
}
const card = (title, desc, body, wide) => `<div class="card${wide ? ' wide' : ''}"><h2>${title}</h2><div class="d">${desc}</div>${body}</div>`;
const empty = t => `<div class="state" style="padding:24px 0">${t}</div>`;

// ---------- render ----------
function render() {
  const today = iso(Date.now()), start = addD(today, -(days - 1));
  const dList = Array.from({ length: days }, (_, i) => addD(start, i));
  const P = ALL.filter(r => !plat || r.plat === plat);
  const R = P.filter(r => r.days[r.days.length - 1] >= start);
  $('sub').textContent = `${fmt(P.length)} player${P.length === 1 ? '' : 's'} tracked · ${fmt(R.length)} played in the last ${days} days · updated ${new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`;
  if (!P.length) { $('main').innerHTML = `<div class="state">No players with analytics yet${plat ? ' on this platform' : ''}. Stats start arriving after players open version 88 or newer.</div>`; return; }
  const dau = P.filter(r => r.days.includes(today)).length, wau = P.filter(r => r.days.some(d => d >= addD(today, -6))).length, mau = P.filter(r => r.days.some(d => d >= addD(today, -29))).length;
  const c1 = P.filter(r => r.days[0] <= addD(today, -1)), d1 = c1.filter(r => r.days.includes(addD(r.days[0], 1))).length;
  const c7 = P.filter(r => r.days[0] <= addD(today, -7)), d7 = c7.filter(r => r.days.some(d => diffD(r.days[0], d) >= 7)).length;
  const sess = R.flatMap(r => (r.sl || []).map(s => Array.isArray(s) ? s[0] : s)).filter(v => typeof v === 'number' && v > 0);
  const playM = median(R.map(r => (r.p || 0) / 60).filter(v => v > 0));
  const kpi = (l, v, h) => `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="h">${h}</div></div>`;
  let html = `<div class="kpis">${kpi('Players today', fmt(dau), 'active since midnight UTC')}${kpi('Last 7 days', fmt(wau), 'played at least once')}${kpi('Last 30 days', fmt(mau), 'played at least once')}${kpi('Came back next day', pct(d1, c1.length), `${d1} of ${c1.length} new players`)}${kpi('Still playing after a week', pct(d7, c7.length), `${d7} of ${c7.length} players`)}${kpi('Typical session', mins(median(sess)), `median of ${sess.length} sessions`)}${kpi('Typical total play', mins(playM), 'median per player')}</div><div class="grid">`;
  html += card('Players per day', `Active players (line) and brand-new players (bars), last ${days} days.`, `<div class="legend"><span><i style="background:var(--s1)"></i>Active players</span><span><i style="background:var(--s2)"></i>New players</span></div>` + dailyChart(P, dList), true);
  // funnel
  const fun = MILESTONES.map(([k, l]) => { const hit = R.filter(r => r.ev && r.ev[k] != null), mt = median(hit.map(r => r.ev[k])); return { label: l, v: R.length ? hit.length / R.length * 100 : 0, sub: pct(hit.length, R.length), tip: `<b>${esc(l)}</b><br>${hit.length} of ${R.length} players (${pct(hit.length, R.length)})<br>Typical time to get there: ${mins(mt)} of play` }; });
  html += card('How far players get', `Share of players active in the last ${days} days who reached each milestone, in game order.`, R.length ? hbars(fun, { max: 100, aria: 'Milestone funnel', left: 130 }) : empty('No active players in this range.'));
  // quit points
  const gone = P.filter(r => diffD(r.days[r.days.length - 1], today) >= 3 && r.days[r.days.length - 1] >= addD(start, -60));
  const qc = new Map(); gone.forEach(r => { let last = 'Before tutorial'; MILESTONES.forEach(([k, l]) => { if (r.ev && r.ev[k] != null) last = l; }); qc.set(last, (qc.get(last) || 0) + 1); });
  const qOrder = ['Before tutorial', ...MILESTONES.map(m => m[1])].filter(l => qc.has(l)).map(l => ({ label: l, v: qc.get(l), tip: `<b>${esc(l)}</b><br>${qc.get(l)} players stopped here (${pct(qc.get(l), gone.length)} of quitters)` }));
  html += card('Where players stopped', `Players not seen for 3+ days, by the last milestone they reached (${gone.length} players).`, gone.length ? hbars(qOrder, { aria: 'Last milestone before quitting', color: 'var(--s2)', left: 130 }) : empty('Nobody has dropped off yet.'));
  // opening week + contracts
  const owS = P.filter(r => r.ev && r.ev.ow_start != null);
  const owItems = [1, 2, 3, 4, 5, 6, 7].map(d => { const n = owS.filter(r => r.ev['ow' + d] != null).length; return { label: 'Day ' + d, v: owS.length ? n / owS.length * 100 : 0, sub: pct(n, owS.length), tip: `<b>Opening Week day ${d}</b><br>${n} of ${owS.length} players claimed it (${pct(n, owS.length)})` }; });
  const cto = P.filter(r => r.ev && r.ev.ct_offer != null).length, ctw = P.filter(r => r.ev && r.ev.ct_win != null).length;
  html += card('Opening Week', `Share of new players (${owS.length} started the week, v89+) who claimed each day. Day 2 is your next-day return rate.`, owS.length ? hbars(owItems, { max: 100, aria: 'Opening Week days claimed', left: 70 }) : empty('No players have started Opening Week yet.'));
  html += card('Celebrity Contracts', 'Level 10+ players offered a contract, and how many finished at least one.', hbars([{ label: 'Got an offer', v: cto, tip: `<b>${cto}</b> players got a contract offer` }, { label: 'Finished one', v: ctw, tip: `<b>${ctw}</b> players finished a contract (${pct(ctw, cto)} of those offered)` }], { aria: 'Contracts offered and finished', left: 110 }));
  // platform + device
  const cnt = (arr, f) => { const m = new Map(); arr.forEach(r => { const k = f(r) || 'Unknown'; m.set(k, (m.get(k) || 0) + 1); }); return [...m.entries()].sort((a, b) => b[1] - a[1]); };
  const pl = cnt(R, r => PLAT[r.plat] || r.plat).map(([l, v]) => ({ label: l, v, tip: `<b>${esc(l)}</b><br>${v} players (${pct(v, R.length)})` }));
  html += card('Platforms', `Where players played in the last ${days} days.`, R.length ? hbars(pl, { aria: 'Players by platform', left: 120 }) : empty('No data.'));
  const fd = cnt(R.filter(r => r.fps > 0), r => r.dev).map(([dv]) => { const f = R.filter(r => r.dev === dv && r.fps > 0).map(r => r.fps); return { label: dv, v: median(f), sub: Math.round(median(f)) + ' fps', tip: `<b>${esc(dv)}</b><br>Median ${Math.round(median(f))} fps across ${f.length} players<br>Lowest ${Math.min(...f)} fps` }; });
  html += card('Smoothness by device', 'Median frames per second. Under 30 (dashed line) feels choppy.', fd.length ? hbars(fd, { max: 60, ref: 30, refLabel: '30 fps', aria: 'Median fps by device', left: 90 }) : empty('No frame-rate data yet.'));
  // levels + versions
  const LB = [['1–2', 1, 2], ['3–4', 3, 4], ['5–9', 5, 9], ['10–14', 10, 14], ['15–19', 15, 19], ['20+', 20, 1e9]];
  html += card('Player levels', `Current level of players active in the last ${days} days.`, vbars(LB.map(([l, a, b]) => { const v = R.filter(r => (r.lvl || 1) >= a && (r.lvl || 1) <= b).length; return { label: 'Lv ' + l, v, tip: `<b>Level ${l}</b><br>${v} players (${pct(v, R.length)})` }; }), 'Players by level'));
  const vv = cnt(R, r => 'v' + (r.v || '?')).sort((a, b) => (parseInt(b[0].slice(1)) || 0) - (parseInt(a[0].slice(1)) || 0)).slice(0, 8).map(([l, v]) => ({ label: l, v, tip: `<b>${l}</b><br>${v} players` }));
  html += card('Game versions', 'Which version active players last ran (newest first).', hbars(vv, { aria: 'Players by version', left: 60 }));
  // recent table
  const rec = P.slice().sort((a, b) => (b.last || 0) - (a.last || 0)).slice(0, 25);
  html += card('Recent players', 'The 25 most recently seen players. IDs are random and anonymous.', `<div class="tscroll"><table><thead><tr><th>Player</th><th>Last seen</th><th>Platform</th><th>Device</th><th>Level</th><th>Days played</th><th>Sessions</th><th>Play time</th><th>Furthest milestone</th><th>FPS</th></tr></thead><tbody>${rec.map(r => { let far = '–'; MILESTONES.forEach(([k, l]) => { if (r.ev && r.ev[k] != null) far = l; }); return `<tr><td>${esc(r.id.slice(2, 8))}</td><td>${r.last ? new Date(r.last).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '–'}</td><td>${esc(PLAT[r.plat] || r.plat || '–')}</td><td>${esc(r.dev || '–')}</td><td>${r.lvl || 1}</td><td>${r.days.length}</td><td>${r.s || 0}</td><td>${mins((r.p || 0) / 60)}</td><td>${esc(far)}</td><td>${r.fps || '–'}</td></tr>`; }).join('')}</tbody></table></div>`, true);
  html += '</div>';
  $('main').innerHTML = html; hoverable($('main'));
}

// ---------- controls ----------
document.querySelectorAll('#range button').forEach(b => { b.classList.toggle('on', +b.dataset.d === days); b.addEventListener('click', () => { days = +b.dataset.d; document.querySelectorAll('#range button').forEach(x => x.classList.toggle('on', x === b)); saveUi(); render(); }); });
$('plat').value = plat; $('plat').addEventListener('change', e => { plat = e.target.value; saveUi(); render(); });
async function go() { try { await load(); render(); } catch (e) { $('sub').textContent = 'Could not load stats'; $('main').innerHTML = `<div class="state err">Couldn't reach the stats database (${esc(e.message || e)}). Check your connection and press Refresh.</div>`; } }
$('reload').addEventListener('click', go);
setInterval(() => { if (!document.hidden) go(); }, 300000);
go();
})();
</script>
</body>
</html>
